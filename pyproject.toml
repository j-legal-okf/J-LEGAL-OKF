[project]
name = "jlegal-okf"
version = "0.1.0.dev1"
description = "J-LEGAL-OKF public reference core (JORI Engine)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["defusedxml", "httpx", "PyYAML"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
jlegal = "jlegal_okf.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
