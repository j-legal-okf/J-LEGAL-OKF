name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Scans the tracked tree, which is the gap in front of
      # tools/verify_distribution.py: that verifier reads built artifacts, so
      # nothing ran automatically against the repository itself.
      - name: Scan the tracked tree for boundary violations
        run: |
          set -euo pipefail
          python tools/check_boundary.py

      # CHANGELOG.md is the single source of truth for whether anything has
      # been tagged or released. Four other files used to restate it, which is
      # how one of them goes false while the others stay current. This runs
      # here rather than in the test suite because its exemption inventory has
      # to reach the run's output, and pytest discards a passing test's output.
      - name: Scan the tracked tree for release-state restatements
        run: |
          set -euo pipefail
          python tools/check_release_state.py

  dco:
    # A pull request is where a contributor's certification arrives, and the
    # base..head range is what keeps the repository's own unsigned initial
    # commit out of scope.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check DCO sign-off on the pull request's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python tools/check_dco.py "${BASE_SHA}..${HEAD_SHA}"

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable, with dev extras)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run tests
        run: |
          set -euo pipefail
          python -m pytest -q

  cli-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package (editable, with dev extras)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      # README.md "Offline synthetic example" (lines 106-121): runs the
      # saved-XML path against examples/synthetic_egov_law.xml with no
      # network access, in the exact command order shown there.
      - name: Run offline synthetic example (README "Offline synthetic example")
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          jlegal validate-source examples/synthetic_egov_law.xml --report "$work_dir/admission.json"
          jlegal compile examples/synthetic_egov_law.xml --adapter egov_xml --corpus-id synthetic-egov-law --out-dir "$work_dir/corpus"
          jlegal validate --corpus "$work_dir/corpus/corpus.jsonl" --manifest "$work_dir/corpus/manifest.json" --verify-inputs --source examples/synthetic_egov_law.xml
          jlegal export-okf --corpus "$work_dir/corpus/corpus.jsonl" --manifest "$work_dir/corpus/manifest.json" --out-dir "$work_dir/bundle" --source examples/synthetic_egov_law.xml
          jlegal validate-okf "$work_dir/bundle"

      # Compile the same synthetic fixture into two separate output
      # directories and diff the generated artifacts byte-for-byte.
      # `compile` refuses to write into an existing output directory, so
      # each run gets its own fresh subdirectory under a shared temp root.
      #
      # manifest.json is intentionally excluded from this comparison: it
      # embeds a wall-clock "converted_at" timestamp
      # (src/jlegal_okf/pipeline.py, _now_canonical_utc) that is set at
      # compile time and has no override flag on the CLI, so it is expected
      # to differ between two separate invocations even when nothing else
      # changed. corpus.jsonl, crosswalk.jsonl, and projection.jsonl carry
      # no such timestamp and were confirmed byte-identical across repeated
      # local runs.
      - name: Determinism check (compile output, byte-for-byte)
        run: |
          set -euo pipefail
          tmp_root="$(mktemp -d)"
          out_a="$tmp_root/a"
          out_b="$tmp_root/b"
          jlegal compile examples/synthetic_egov_law.xml --adapter egov_xml --corpus-id synthetic-egov-law --out-dir "$out_a"
          jlegal compile examples/synthetic_egov_law.xml --adapter egov_xml --corpus-id synthetic-egov-law --out-dir "$out_b"
          status=0
          for f in corpus.jsonl crosswalk.jsonl projection.jsonl; do
            if ! cmp -s "$out_a/$f" "$out_b/$f"; then
              echo "::error::determinism check failed: $f differs between runs"
              diff "$out_a/$f" "$out_b/$f" || true
              status=1
            fi
          done
          exit "$status"

  package-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and verify public distributions
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build

          artifact_dir="$(mktemp -d)"
          python -m build --sdist --wheel --outdir "$artifact_dir"
          sdist="$(find "$artifact_dir" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          wheel="$(find "$artifact_dir" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$sdist"
          test -n "$wheel"
          python tools/verify_distribution.py --sdist "$sdist" --wheel "$wheel"

          extract_dir="$(mktemp -d)"
          tar --extract --file "$sdist" --directory "$extract_dir" \
            --no-same-owner --no-same-permissions
          mapfile -t sdist_roots < <(
            find "$extract_dir" -mindepth 1 -maxdepth 1 -type d \
              -regextype posix-extended \
              -regex '.*/jlegal[-_.]+okf-[^/]+' -print
          )
          test "${#sdist_roots[@]}" -eq 1
          sdist_root="${sdist_roots[0]}"

          sdist_env_dir="$(mktemp -d)"
          python -m venv "$sdist_env_dir/venv"
          "$sdist_env_dir/venv/bin/python" -m pip install --upgrade pip
          (
            cd "$sdist_root"
            "$sdist_env_dir/venv/bin/python" -m pip install '.[dev]'
            "$sdist_env_dir/venv/bin/python" -m pytest -q
          )

          readme_work_dir="$(mktemp -d)"
          (
            cd "$sdist_root"
            "$sdist_env_dir/venv/bin/jlegal" validate-source \
              examples/synthetic_egov_law.xml \
              --report "$readme_work_dir/admission.json"
            "$sdist_env_dir/venv/bin/jlegal" compile \
              examples/synthetic_egov_law.xml --adapter egov_xml \
              --corpus-id synthetic-egov-law \
              --out-dir "$readme_work_dir/corpus"
            "$sdist_env_dir/venv/bin/jlegal" validate \
              --corpus "$readme_work_dir/corpus/corpus.jsonl" \
              --manifest "$readme_work_dir/corpus/manifest.json" \
              --verify-inputs --source examples/synthetic_egov_law.xml
            "$sdist_env_dir/venv/bin/jlegal" export-okf \
              --corpus "$readme_work_dir/corpus/corpus.jsonl" \
              --manifest "$readme_work_dir/corpus/manifest.json" \
              --out-dir "$readme_work_dir/bundle" \
              --source examples/synthetic_egov_law.xml
            "$sdist_env_dir/venv/bin/jlegal" validate-okf \
              "$readme_work_dir/bundle"
          )

          rebuilt_dir="$(mktemp -d)"
          (
            cd "$sdist_root"
            python -m build --wheel --outdir "$rebuilt_dir"
          )
          rebuilt_wheel="$(find "$rebuilt_dir" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$rebuilt_wheel"

          wheel_env_dir="$(mktemp -d)"
          python -m venv "$wheel_env_dir/venv"
          "$wheel_env_dir/venv/bin/python" -m pip install --upgrade pip
          "$wheel_env_dir/venv/bin/python" -m pip install "$rebuilt_wheel"
          "$wheel_env_dir/venv/bin/jlegal" --help
          for subcommand in \
            validate-source compile validate fetch export-okf validate-okf; do
            "$wheel_env_dir/venv/bin/jlegal" "$subcommand" --help
          done
